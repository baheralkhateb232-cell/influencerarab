 <linearGradient id="slate" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#333439"/><stop offset=".22" stop-color="#1f2025"/><stop offset="1" stop-color="#07090e"/></linearGradient>
 <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#38383b"/><stop offset=".55" stop-color="#191a20"/><stop offset="1" stop-color="#0c0e12"/></linearGradient>
