<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1100" height="1030" viewBox="0 0 1100 1030" role="img" aria-labelledby="title desc">
<title id="title">Premium visual of three influencer campaign agency proposals</title>
<desc id="desc">Original dark bronze and gold editorial illustration with proposal dossier, comparison cards, analytics graph, and a fountain pen.</desc>
<defs>
 <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF0B8"/><stop offset=".18" stop-color="#F4D48C"/><stop offset=".58" stop-color="#BC8C45"/><stop offset=".78" stop-color="#F4CD7C"/><stop offset="1" stop-color="#725333"/></linearGradient>
